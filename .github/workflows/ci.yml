name: CI - Build, Test & Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: .NET 8 Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore src/BusTrack.Api/BusTrack.Api.sln

      - name: Build Solution (Release)
        run: dotnet build src/BusTrack.Api/BusTrack.Api.sln -c Release --no-restore

      - name: Run Automated Tests
        run: dotnet test tests/BusTrack.Api.Tests/BusTrack.Api.Tests.csproj -c Release --no-build --verbosity normal --logger "console;verbosity=detailed"

  client-build:
    name: React Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Client (Vite + TypeScript)
        run: |
          cd client
          npm run build
